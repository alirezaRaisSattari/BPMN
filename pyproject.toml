[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bpmn-analyst"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = ["playwright>=1.54,<2", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2"]

[tool.setuptools.packages.find]
include = ["bpmn_analyst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
